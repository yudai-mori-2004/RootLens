[toolchain]
# anchor CLI は AVM で pin しない (cargo deps が真実)。
# 必須: Agave 3.1.14+ (= cargo-build-sbf 同梱の rustc 1.89+) でないと
# anchor-lang 0.31.1 が引き込む solana-program 2.3 の blake3 1.8 が
# constant_time_eq 0.4 (edition2024) を要求して落ちる。
# 現環境: solana-cli (Agave) 3.1.14, platform-tools v1.52, rustc 1.89.0

[features]
resolution = true
skip-lint = false

[programs.localnet]
license_nft = "G1PWd1nMe63isDaYT3iijcyWac9d4RE1CBrvaKZFjpV8"

[programs.devnet]
license_nft = "G1PWd1nMe63isDaYT3iijcyWac9d4RE1CBrvaKZFjpV8"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Devnet"
# プロジェクトローカル鍵を使う。~/.config/solana/id.json は別プロジェクトの
# 鍵 (例: title-protocol authority) と衝突する可能性があるため依存しない。
wallet = "keys/dev/solana/deployer.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 'tests/license-nft/**/*.spec.ts'"
