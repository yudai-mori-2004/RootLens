<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1270px;
  height: 760px;
  overflow: hidden;
  background: linear-gradient(135deg, #f0f0ec 0%, #e8e8e4 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 80px;
}
.top {
  text-align: center;
  margin-bottom: 40px;
}
.logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.logo img {
  width: 32px;
  height: 32px;
  border-radius: 8px;
}
.logo span {
  font-size: 20px;
  font-weight: 700;
  color: #1E3A5F;
}
h2 {
  font-size: 32px;
  font-weight: 700;
  color: #1a1c1e;
  margin-bottom: 8px;
}
p {
  font-size: 16px;
  color: #6e7279;
}
.phones {
  display: flex;
  gap: 32px;
  align-items: flex-start;
}
.phoneCol {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.phone {
  width: 200px;
  border-radius: 28px;
  border: 3px solid #303034;
  background: linear-gradient(145deg, #38383c 0%, #18181c 100%);
  overflow: hidden;
  position: relative;
  box-shadow:
    0 2px 2px hsl(220deg 20% 30% / 0.08),
    0 4px 4px hsl(220deg 20% 30% / 0.08),
    0 8px 8px hsl(220deg 20% 30% / 0.06),
    0 16px 16px hsl(220deg 20% 30% / 0.04),
    0 32px 48px hsl(220deg 20% 30% / 0.06);
}
.island {
  width: 56px;
  height: 16px;
  background: #18181c;
  border-radius: 999px;
  position: absolute;
  top: 7px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
}
.phone img {
  display: block;
  width: 100%;
  height: auto;
}
.label {
  font-size: 15px;
  font-weight: 600;
  color: #1E3A5F;
}
.sublabel {
  font-size: 13px;
  color: #6e7279;
  text-align: center;
  max-width: 200px;
}
.arrow {
  font-size: 28px;
  color: #1E3A5F;
  margin-top: 180px;
  opacity: 0.4;
}
</style>
</head>
<body>
  <div class="top">
    <div class="logo">
      <img src="/logo.png" alt="">
      <span>RootLens</span>
    </div>
    <h2>Capture. Prove. Share.</h2>
    <p>Every step is cryptographically verified. Anyone can check the proof.</p>
  </div>
  <div class="phones">
    <div class="phoneCol">
      <div class="phone">
        <div class="island"></div>
        <img src="/app-camera.png" alt="Camera">
      </div>
      <div class="label">1. Capture</div>
      <div class="sublabel">C2PA signature attached at the moment of capture</div>
    </div>
    <div class="arrow">&rarr;</div>
    <div class="phoneCol">
      <div class="phone">
        <div class="island"></div>
        <img src="/app-verify.png" alt="Verify">
      </div>
      <div class="label">2. Prove</div>
      <div class="sublabel">TEE verifies and records proof on Solana blockchain</div>
    </div>
    <div class="arrow">&rarr;</div>
    <div class="phoneCol">
      <div class="phone">
        <div class="island"></div>
        <img src="/app-gallery.png" alt="Gallery">
      </div>
      <div class="label">3. Share</div>
      <div class="sublabel">Anyone can verify the proof in their browser</div>
    </div>
  </div>
</body>
</html>
