<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1270px;
  height: 760px;
  overflow: hidden;
  background: linear-gradient(135deg, #f0f0ec 0%, #e8e8e4 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 80px;
  padding: 60px 80px;
}
.text {
  flex: 1;
  max-width: 480px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 32px;
}
.logo img {
  width: 36px;
  height: 36px;
  border-radius: 8px;
}
.logo span {
  font-size: 22px;
  font-weight: 700;
  color: #1E3A5F;
}
h1 {
  font-size: 48px;
  font-weight: 700;
  color: #1E3A5F;
  line-height: 1.15;
  letter-spacing: -0.02em;
  margin-bottom: 20px;
}
p {
  font-size: 18px;
  line-height: 1.6;
  color: #4a4e54;
  margin-bottom: 12px;
}
.badges {
  display: flex;
  gap: 10px;
  margin-top: 24px;
}
.badge {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 8px;
  background: #18181c;
  color: #fff;
}
.badge-label { font-size: 10px; opacity: 0.8; }
.badge-name { font-size: 15px; font-weight: 600; }
.phone {
  width: 260px;
  flex-shrink: 0;
  border-radius: 32px;
  border: 3px solid #303034;
  background: linear-gradient(145deg, #38383c 0%, #18181c 100%);
  overflow: hidden;
  position: relative;
  box-shadow:
    0 2px 2px hsl(220deg 20% 30% / 0.08),
    0 4px 4px hsl(220deg 20% 30% / 0.08),
    0 8px 8px hsl(220deg 20% 30% / 0.06),
    0 16px 16px hsl(220deg 20% 30% / 0.04),
    0 32px 48px hsl(220deg 20% 30% / 0.06);
}
.island {
  width: 64px;
  height: 18px;
  background: #18181c;
  border-radius: 999px;
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
}
.phone img {
  display: block;
  width: 100%;
  height: auto;
}
</style>
</head>
<body>
  <div class="text">
    <div class="logo">
      <img src="/logo.png" alt="">
      <span>RootLens</span>
    </div>
    <h1>Prove it's real.</h1>
    <p>Take a photo. Get a tamper-proof record that it was really captured. Share a link anyone can check.</p>
    <p style="color:#1a1c1e;font-weight:500;">Camera app that proves your content is authentic, built on an open verification protocol.</p>
    <div class="badges">
      <div class="badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        <div><div class="badge-label">Coming soon</div><div class="badge-name">App Store</div></div>
      </div>
      <div class="badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5v-17c0-.83.52-1.28 1.09-1.28.18 0 .37.05.56.15l15.32 8.5c.55.31.72.77.72 1.13s-.17.82-.72 1.13L4.65 21.63c-.19.1-.38.15-.56.15C3.52 21.78 3 21.33 3 20.5z"/></svg>
        <div><div class="badge-label">Coming soon</div><div class="badge-name">Google Play</div></div>
      </div>
    </div>
  </div>
  <div class="phone">
    <div class="island"></div>
    <img src="/app-verify.png" alt="Verified content">
  </div>
</body>
</html>
