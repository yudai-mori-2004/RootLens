# 親 workspace に取り込まれないように切り離す。
[workspace]

[package]
name = "c2pa-bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# mock-device と version を揃える (= 0.84.1)。 byte-deterministic な C2PA 出力のため pin。
c2pa = { version = "=0.84.1", default-features = false, features = ["rust_native_crypto", "http_ureq"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

# pipeline1 (D1/D2/content_id) で使う
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
anyhow = "1"

[profile.release]
lto = true
strip = true
opt-level = "s"
