[package]
name = "jarosz-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Jarosz downsampling for browser-side PDQ hash computation. Copied from title-protocol wasm-host."

[lib]
crate-type = ["cdylib"]

[dependencies]
dlmalloc = { version = "0.2", features = ["global"] }

[profile.release]
opt-level = "s"
lto = true
