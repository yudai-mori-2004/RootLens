# 親 root-lens/Cargo.toml の workspace に取り込まれないように、 空の [workspace] で切り離す。
# 本 crate は独立した tool。
[workspace]

[package]
name = "rootlens-mock-device"
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"
description = "iOS 端末を模擬する macOS Rust CLI: raw MP4 -> 2 段 C2PA 署名 + 顔ぼかし + R2 アップロード"

[[bin]]
name = "mock-device"
path = "src/main.rs"

[dependencies]
# C2PA 署名 + reading。 byte-deterministic 出力のため pin。
# Title Protocol が 0.84.1 で運用しているので version を合わせる。
c2pa = "=0.84.1"

# signature_hash 算出に使う。 自前 JUMBF parser の依存もこれだけで足りる。
sha2 = "0.10"
hex = "0.4"

# CLI / シリアライズ
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# 非同期 + R2 (= S3 互換) アップロード
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process"] }
aws-config = "1"
aws-sdk-s3 = { version = "1", features = ["sigv4a"] }
aws-credential-types = "1"

# Title Protocol Gateway (= http://13.113.217.17:3000/process + /extension/solana) を叩く HTTP client。
# サーバ flow には載らない: R2 upload 後に mock-device 自身が /process と /extension/solana を呼ぶ。
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# v0.1.3 step 6 (= cNFT 発行) で使う Solana 周り。
# TP Gateway `POST /extension/solana` で受け取った partial_tx (= base64 VersionedTransaction)
# を deserialize → payer 鍵で署名 → RPC に broadcast する。 title-protocol/crates/cli と同じ
# version 2 系を採用。
solana-sdk = "~2.2"
solana-client = "~2.2"
base64 = "0.22"
bincode = "1.3"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
bs58 = "0.5"

[dev-dependencies]
# テストで一時ディレクトリを扱う
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
